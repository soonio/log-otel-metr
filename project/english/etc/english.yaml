Name: english.rpc
ListenOn: 0.0.0.0:8811
#Etcd:
#  Hosts:
#  - 127.0.0.1:2379
#  Key: english.rpc

Log:
  ServiceName: english
  Mode: file
  Path: logs
  TimeFormat: 2006-01-02 15:04:05.000
  KeepDays: 7  # 日志保留7天
  Compress: true  # 压缩旧日志

# 生产环境禁用 DevServer
DevServer:
  Enabled: true
  Host: "0.0.0.0"
  Port: 9100


Telemetry:
  Name: english
  Endpoint: oc:4817
  Batcher: otlpgrpc
