Name: greeting-api
Host: 0.0.0.0
Port: 8810

Log:
  ServiceName: api
  Mode: file
  Path: logs
  TimeFormat: 2006-01-02 15:04:05.000
  KeepDays: 7  # 日志保留7天
  Compress: true  # 压缩旧日志

DevServer:
  Enabled: true
  Host: "0.0.0.0"
  Port: 9100

English:
  Target: "english:8811"
  Timeout: 5000  # 5秒超时

Chinese:
  Target: "chinese:8812"
  Timeout: 5000  # 5秒超时

# 限流配置
RateLimit:
  Period: 1s  # 时间窗口
  Quota: 100  # 每秒最多100个请求

Telemetry:
  Name: api
  Endpoint: oc:4817
  Batcher: otlpgrpc